<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MindAR — Image Tracking Demo</title>

    <!-- A-Frame 1.6.0 -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR 1.2.5 — image tracking + A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: calc(0.75rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right)) 0.75rem
          calc(1rem + env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.6);
        color: white;
      }

      .overlay a {
        color: white;
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.5rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 0.375rem;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }

      .overlay a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .overlay h1 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
        max-width: 60vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .instructions {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 1rem calc(1rem + env(safe-area-inset-right))
          calc(1rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.7);
        color: white;
        text-align: center;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .instructions a {
        color: #93c5fd;
      }

      .a-enter-vr {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <!-- Navigation overlay -->
    <div class="overlay">
      <a href="./">← Back</a>
      <h1>MindAR — Image Tracking</h1>
    </div>

    <!-- Instructions -->
    <div class="instructions">
      Point your camera at one of the starter Pokemon cards in
      <code>public/mindar/cards</code>. Each target shows its card image, the
      Pokemon name label, and a matching 3D model. Requires HTTPS or localhost.
    </div>

    <!--
      MindAR A-Frame scene: image tracking using cards.mind.
      The .mind file is a pre-compiled image target descriptor.
    -->
    <a-scene
      mindar-image="imageTargetSrc: ./mindar/cards.mind; maxTrack: 4; filterMinCF: 0.0005; filterBeta: 0.0005;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="card-bulbasaur" src="./mindar/cards/bulbasaur.jpg" />
        <img id="card-charmander" src="./mindar/cards/charmander.jpg" />
        <img id="card-squirtle" src="./mindar/cards/squirtle.jpg" />
        <img id="card-pikachu" src="./mindar/cards/pikachu.jpg" />
        <a-asset-item
          id="model-charmander"
          src="./models/pokemon/charmander.glb"
        ></a-asset-item>
        <a-asset-item
          id="model-squirtle"
          src="./models/pokemon/squirtle.glb"
        ></a-asset-item>
        <a-asset-item
          id="model-bulbasaur"
          src="./models/pokemon/bulbasaur.glb"
        ></a-asset-item>
        <a-asset-item
          id="model-pikachu"
          src="./models/pokemon/pikachu.glb"
        ></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity light="type: ambient; intensity: 0.75"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.9"
        position="0.5 1 1"
      ></a-entity>

      <!-- targetIndex: 0=bulbasaur, 1=charmander, 2=squirtle, 3=pikachu -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          src="#card-bulbasaur"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="BULBASAUR"
          align="center"
          width="2.2"
          color="#16a34a"
          position="0 0.42 0.04"
        ></a-text>
        <a-gltf-model
          src="#model-bulbasaur"
          position="0 -0.16 0.03"
          rotation="90 0 0"
          scale="0.16 0.16 0.16"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane
          src="#card-charmander"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="CHARMANDER"
          align="center"
          width="2.4"
          color="#f97316"
          position="0 0.42 0.04"
        ></a-text>
        <a-gltf-model
          src="#model-charmander"
          position="0 -0.16 0.03"
          rotation="90 0 0"
          scale="0.14 0.14 0.14"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane
          src="#card-squirtle"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="SQUIRTLE"
          align="center"
          width="1.9"
          color="#1d4ed8"
          position="0 0.42 0.04"
        ></a-text>
        <a-gltf-model
          src="#model-squirtle"
          position="0 -0.16 0.03"
          rotation="90 0 0"
          scale="0.18 0.18 0.18"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane
          src="#card-pikachu"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="PIKACHU"
          align="center"
          width="1.8"
          color="#facc15"
          position="0 0.42 0.04"
        ></a-text>
        <a-gltf-model
          src="#model-pikachu"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.2 0.2 0.2"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
