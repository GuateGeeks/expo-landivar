<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MindAR — Image Tracking Demo</title>

    <!-- A-Frame 1.6.0 -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR 1.2.5 — image tracking + A-Frame integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: calc(0.75rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right)) 0.75rem
          calc(1rem + env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.6);
        color: white;
      }

      .overlay a {
        color: white;
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.5rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 0.375rem;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }

      .overlay a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .overlay h1 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
        max-width: 60vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .instructions {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 1rem calc(1rem + env(safe-area-inset-right))
          calc(1rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.7);
        color: white;
        text-align: center;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .instructions a {
        color: #93c5fd;
      }

      .a-enter-vr {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <!-- Navigation overlay -->
    <div class="overlay">
      <a href="./">← Back</a>
      <h1>MindAR — Image Tracking</h1>
    </div>

    <!-- Instructions -->
    <div class="instructions">
      Point your camera at one of the energy cards in
      <code>public/mindar/cards</code>. Each target shows its card image, energy
      type label, and a matching 3D primitive. Requires HTTPS or localhost.
    </div>

    <!--
      MindAR A-Frame scene: image tracking using cards.mind.
      The .mind file is a pre-compiled image target descriptor.
    -->
    <a-scene
      mindar-image="imageTargetSrc: ./mindar/cards.mind;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="card-fire" src="./mindar/cards/fire_001.png" />
        <img id="card-water" src="./mindar/cards/water_002.png" />
        <img id="card-grass" src="./mindar/cards/grass_003.png" />
        <img id="card-electric" src="./mindar/cards/electric_004.png" />
        <img id="card-psychic" src="./mindar/cards/psychic_005.png" />
        <img id="card-dark" src="./mindar/cards/dark_006.png" />
        <img id="card-steel" src="./mindar/cards/steel_007.png" />
        <img id="card-fight" src="./mindar/cards/fight_008.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity light="type: ambient; intensity: 0.75"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.9"
        position="0.5 1 1"
      ></a-entity>

      <!-- targetIndex: 0=fire, 1=water, 2=grass, 3=electric, 4=psychic, 5=dark, 6=steel, 7=fight -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          src="#card-fire"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="FIRE"
          align="center"
          width="1.4"
          color="#f97316"
          position="0 0.42 0.04"
        ></a-text>
        <a-cone
          position="0 -0.08 0.16"
          radius-bottom="0.1"
          radius-top="0.03"
          height="0.24"
          color="#f97316"
          animation="property: rotation; to: 0 360 0; dur: 2400; easing: linear; loop: true;"
        ></a-cone>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane
          src="#card-water"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="WATER"
          align="center"
          width="1.6"
          color="#1d4ed8"
          position="0 0.42 0.04"
        ></a-text>
        <a-sphere
          position="0 -0.08 0.16"
          radius="0.11"
          color="#1d4ed8"
          animation="property: scale; to: 1.25 1.25 1.25; dur: 900; easing: easeInOutSine; loop: true; dir: alternate;"
        ></a-sphere>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane
          src="#card-grass"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="GRASS"
          align="center"
          width="1.6"
          color="#16a34a"
          position="0 0.42 0.04"
        ></a-text>
        <a-dodecahedron
          position="0 -0.08 0.16"
          radius="0.12"
          color="#16a34a"
          animation="property: rotation; to: 360 360 0; dur: 2600; easing: linear; loop: true;"
        ></a-dodecahedron>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane
          src="#card-electric"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="ELECTRIC"
          align="center"
          width="1.8"
          color="#facc15"
          position="0 0.42 0.04"
        ></a-text>
        <a-torus
          position="0 -0.08 0.16"
          radius="0.11"
          radius-tubular="0.03"
          color="#facc15"
          rotation="75 0 0"
          animation="property: rotation; to: 75 360 360; dur: 2300; easing: linear; loop: true;"
        ></a-torus>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane
          src="#card-psychic"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="PSYCHIC"
          align="center"
          width="1.8"
          color="#db2777"
          position="0 0.42 0.04"
        ></a-text>
        <a-octahedron
          position="0 -0.08 0.16"
          radius="0.13"
          color="#db2777"
          animation="property: scale; to: 0.75 1.3 0.75; dur: 1300; easing: easeInOutCubic; loop: true; dir: alternate;"
        ></a-octahedron>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5">
        <a-plane
          src="#card-dark"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="DARK"
          align="center"
          width="1.4"
          color="#d4d4d8"
          position="0 0.42 0.04"
        ></a-text>
        <a-box
          position="0 -0.08 0.16"
          depth="0.18"
          height="0.18"
          width="0.18"
          color="#3f3f46"
          animation="property: rotation; to: 0 360 0; dur: 2400; easing: linear; loop: true;"
        ></a-box>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 6">
        <a-plane
          src="#card-steel"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="STEEL"
          align="center"
          width="1.5"
          color="#e5e7eb"
          position="0 0.42 0.04"
        ></a-text>
        <a-cylinder
          position="0 -0.08 0.16"
          radius="0.09"
          height="0.22"
          color="#9ca3af"
          animation="property: position; to: 0 -0.03 0.16; dur: 1200; easing: easeInOutQuad; loop: true; dir: alternate;"
        ></a-cylinder>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 7">
        <a-plane
          src="#card-fight"
          position="0 0 0.01"
          width="1.0"
          height="1.4"
          material="shader: flat; side: double"
        ></a-plane>
        <a-plane
          position="0 0.42 0.03"
          width="0.54"
          height="0.13"
          color="#111111"
          opacity="0.72"
        ></a-plane>
        <a-text
          value="FIGHT"
          align="center"
          width="1.4"
          color="#c2410c"
          position="0 0.42 0.04"
        ></a-text>
        <a-tetrahedron
          position="0 -0.08 0.16"
          radius="0.14"
          color="#c2410c"
          animation="property: position; to: 0 -0.02 0.16; dur: 1000; easing: easeInOutSine; loop: true; dir: alternate;"
        ></a-tetrahedron>
      </a-entity>
    </a-scene>
  </body>
</html>
